<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Indigo geometric favicon inspired by M-Bot">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- subtle silhouette glow for dark tabs -->
  <path d="M128 32 L166 64 L220 78 L176 118 L200 190 L144 154 L128 222 L112 154 L56 190 L80 118 L36 78 L90 64 Z"
        fill="#4338ca" opacity="0.22" filter="url(#softGlow)"/>

  <!-- main M/W silhouette -->
  <path d="M128 32
           L166 64
           L220 78
           L176 118
           L200 190
           L144 154
           L128 222
           L112 154
           L56 190
           L80 118
           L36 78
           L90 64 Z"
        fill="url(#body)"/>

  <!-- inner faceting -->
  <path d="M128 48 L156 72 L195 84 L164 112 L180 166 L142 142 L128 194 L114 142 L76 166 L92 112 L61 84 L100 72 Z"
        fill="#4f46e5" opacity="0.7"/>

  <!-- cockpit / nose -->
  <path d="M128 52
           C141 52 152 61 155 77
           C147 89 138 99 128 108
           C118 99 109 89 101 77
           C104 61 115 52 128 52 Z"
        fill="url(#canopy)"/>

  <!-- center spine -->
  <path d="M123 96 L133 96 L140 150 L128 196 L116 150 Z" fill="#e0e7ff" opacity="0.75"/>

  <!-- side intake/details -->
  <path d="M89 95 L109 102 L94 118 L80 113 Z" fill="#a5b4fc" opacity="0.75"/>
  <path d="M167 102 L187 95 L196 113 L182 118 Z" fill="#a5b4fc" opacity="0.75"/>

  <!-- rear fins -->
  <path d="M70 74 L92 68 L86 92 Z" fill="#c4b5fd" opacity="0.85"/>
  <path d="M164 68 L186 74 L170 92 Z" fill="#c4b5fd" opacity="0.85"/>

  <!-- tiny engine lights -->
  <circle cx="100" cy="167" r="4" fill="#e0e7ff" opacity="0.9"/>
  <circle cx="156" cy="167" r="4" fill="#e0e7ff" opacity="0.9"/>
</svg>
